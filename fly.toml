# Pillar on Fly.io: one always-on server in Toronto with one encrypted disk.
# It has to stay at one machine, because everyone's data is SQLite files on that disk.
app = "pillar-app"
primary_region = "yyz"

[[mounts]]
  source = "pillar_data"
  destination = "/data"
  initial_size = "3gb"
  snapshot_retention = 14
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "10GB"

[http_service]
  internal_port = 8080
  force_https = true
  # Stays running, because the background sync lives in this process.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
